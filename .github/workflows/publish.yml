name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24 x64
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: x64
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: |
          npm ci

      - name: Publish
        run: |
          npm publish --access=public
