<!DOCTYPE html>
<html>

<head>
  <title>MapLibre GL JS v5</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>

  <!-- Leaflet browser global -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MapLibre GL JS v5 browser global -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
</head>

<body>
  <div id="map"></div>

  <!-- The UMD adapter supports the browser globals used by MapLibre GL JS v2-v5. -->
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
  <script>
    var map = L.map('map', {
      maxBounds: [[180, -Infinity], [-180, Infinity]],
      maxBoundsViscosity: 1,
      minZoom: 1
    }).setView([38.912753, -77.032194], 2);

    L.marker([38.912753, -77.032194])
      .bindPopup('MapLibre GL JS v5 with the UMD setup')
      .addTo(map)
      .openPopup();

    var gl = L.maplibreGL({
      style: 'https://demotiles.maplibre.org/style.json'
    }).addTo(map);
  </script>
</body>

</html>
