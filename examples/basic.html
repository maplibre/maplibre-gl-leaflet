<!DOCTYPE html>
<html>

<head>
  <title>WebGL</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Maplibre GL -->
  <link href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" rel='stylesheet' />

  <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
        "maplibre-gl": "https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs"
      }
    }
  </script>

</head>

<body>
  <div id="map"></div>

  <script type="module">
    import * as L from 'leaflet';
    import { maplibreGL } from 'https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/dist/leaflet-maplibre-gl.mjs';

    var map = L.map('map', {
      maxBounds: [[180, -Infinity], [-180, Infinity]], // restrict bounds to avoid max latitude issues with MapLibre GL
      maxBoundsViscosity: 1, // make the max bounds "solid" so users cannot pan past them
      minZoom: 1 // prevent sync issues at zoom 0
    }).setView([38.912753, -77.032194], 2);

    L.marker([38.912753, -77.032194])
      .bindPopup("Hello <b>Leaflet GL</b>!<br>Whoa, it works!")
      .addTo(map)
      .openPopup();

    var gl = maplibreGL({
      style: 'https://demotiles.maplibre.org/style.json'
    }).addTo(map);

  </script>
</body>

</html>
